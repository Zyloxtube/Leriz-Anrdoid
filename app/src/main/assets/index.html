/* Feed geometry and overlays aligned to the iOS SwiftUI layout. */
#app{position:relative;isolation:isolate}
.topbar{position:absolute;top:0;left:0;right:0;height:auto;min-height:99px;flex-shrink:0;justify-content:space-between;gap:9px;padding:49px 18px 12px;background:linear-gradient(180deg,#000b 0%,#0005 65%,transparent 100%);border:0;z-index:6}
.mini-brand{display:flex;align-items:center;gap:5px;flex-shrink:0;font-size:25px;letter-spacing:-1.2px;white-space:nowrap}
.brand-mark{font-size:25px;background:linear-gradient(135deg,var(--cyan),var(--purple),var(--pink));color:transparent;background-clip:text;-webkit-background-clip:text}
.feed-tabs{position:static;inset:auto;top:auto;left:auto;right:auto;height:30px;display:flex;align-items:center;justify-content:center;gap:13px;flex:1;min-width:0;background:none;pointer-events:auto}
.feed-tabs button{height:30px;min-width:0;padding:0 0 5px;background:none;color:#ffffffad;font-size:13px;font-weight:650;white-space:nowrap}
.feed-tabs button.active{color:#fff;font-weight:800}
.feed-tabs button.active:after{height:3px;width:28px;bottom:0;background:var(--cyan);border-radius:999px}
.top-actions{gap:0;flex-shrink:0}
.icon-btn{height:32px;min-width:30px;width:30px;border-radius:50%;background:transparent;padding:0}
.icon-btn .sym{font-size:23px}
.feed-area{position:absolute;inset:0;width:100%;height:100%;flex:none;min-height:0;overflow:hidden}
.feed-scroller{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain}
.clip{height:100dvh;min-height:100dvh;position:relative;scroll-snap-align:start;border-radius:0}
.clip-content{left:15px;right:75px;bottom:112px}
.actions{right:12px;bottom:118px;gap:20px}
.bottom-nav{position:absolute;left:0;right:0;bottom:0;height:105px;flex-shrink:0;justify-content:space-around;padding:20px 24px 28px;background:linear-gradient(0deg,#000 0%,#000e 53%,#0000 100%);border-top:0;z-index:5}
.nav-item{gap:5px;font-size:10px}
.nav-item .sym{font-size:21px}
.nav-item.create .sym{font-size:26px;padding:3px 8px;border-radius:9px}
#app.page-mode .topbar,#app.page-mode .bottom-nav{display:none}
#app.page-mode #main{position:absolute;inset:0;width:100%;height:100%;overflow:auto}
#app.page-mode .page{height:100%;padding:20px 17px 30px;max-width:none}
@media(min-width:600px){.clip{height:100dvh;min-height:100dvh;max-width:none;margin:0}.clip-content{left:15px;right:75px}.actions{right:12px}}

/* iOS-matched feed, profile, camera composer, and comments sheet */
.topbar{padding-top:calc(env(safe-area-inset-top) + 12px);min-height:calc(env(safe-area-inset-top) + 58px)}
.bottom-nav{height:calc(env(safe-area-inset-bottom) + 78px);padding:12px 22px calc(env(safe-area-inset-bottom) + 15px)}
.clip-content{bottom:calc(env(safe-area-inset-bottom) + 104px);left:16px;right:76px}
.actions{bottom:calc(env(safe-area-inset-bottom) + 112px);right:13px;gap:19px}
.clip video{object-fit:contain;background:#000}
.overlay{align-items:flex-end;background:#0008}
.sheet{height:50dvh;max-height:98dvh;border-radius:23px 23px 0 0;padding-bottom:env(safe-area-inset-bottom);background:#111116}
.sheet-head{height:auto;min-height:74px;display:block;padding:10px 17px 11px}
.sheet-handle{width:38px;height:4px;border-radius:8px;background:#ffffff66;margin:0 auto 10px}
.sheet-title-row{display:flex;align-items:center;justify-content:space-between}
.sheet-title-main{font-size:17px;font-weight:800}
.sheet-subtitle{font-size:11px;color:#ffffff9e;margin-top:3px}
.comment{gap:11px;padding:13px 0}.comment .avatar{height:43px;width:43px}
.comment-user{font-size:12px;font-weight:650}.comment-text{font-size:14px;line-height:1.42;margin-top:5px}
.comment-meta{gap:13px;font-size:11px;margin-top:8px}.comment-meta button{font-size:11px}
.reply{margin-left:30px;border-left:2px solid #ffffff20;padding-left:12px}
.page{padding-top:calc(env(safe-area-inset-top) + 18px)!important}
.page-title{font-size:23px;letter-spacing:-.45px;margin-bottom:22px}
.profile-head{gap:16px;margin:18px 0 20px;align-items:center}
.profile-head .avatar{width:88px;height:88px;font-size:28px}
.profile-name{font-size:20px;font-weight:750;letter-spacing:-.3px}
.stats{padding:15px 0;border-top:1px solid #ffffff12;border-bottom:1px solid #ffffff12;margin:12px 0 14px}
.stat b{font-size:18px;color:white}.stat span{font-size:11px;color:#aaa;margin-top:4px}
.profile-buttons{gap:10px;margin:17px 0}.profile-buttons .secondary{height:43px;border-radius:9px;font-size:13px}
.profile-buttons .secondary:first-child{background:#ffffff14;border-color:transparent}
.profile-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin:18px -17px 0}
.profile-grid .grid-video{aspect-ratio:9/16;border-radius:0}
.create-shell{height:100%;min-height:0;display:flex;flex-direction:column;gap:0}
.create-top{display:flex;align-items:center;justify-content:space-between;padding:0 2px 14px}
.create-top .page-title{margin:0;font-size:18px}
.create-preview{position:relative;flex:1;min-height:230px;background:linear-gradient(145deg,#17121f,#08080c 58%,#101b20);border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin:0 -7px 12px}
.create-preview .preview-icon{font-size:52px;color:#ffffffa0}

.create-filters{display:flex;gap:10px;overflow-x:auto;padding:8px 0 13px}

.create-filter.active{color:var(--cyan)}.create-filter.active .filter-icon{border:2px solid var(--cyan)}
.create-bottom{display:flex;align-items:center;gap:14px;padding:8px 0 16px}.create-bottom input[type=file]{display:none}
.media-pick{width:54px;height:58px;border-radius:12px;background:#ffffff12;display:grid;place-items:center;flex-shrink:0}

.record-button span{width:58px;height:58px;border-radius:50%;background:#fa285e;display:block}
.create-bottom .spacer{flex:1}
.create-caption{width:100%;min-height:58px;background:#ffffff0d;border:1px solid #ffffff18;border-radius:13px;padding:12px;color:#fff;resize:vertical}
@media(min-width:600px){.sheet{max-width:560px;margin:0 auto}.page{padding-top:24px!important}}

.sheet{width:100%;height:50dvh;max-height:94dvh;border:0;border-radius:23px 23px 0 0;padding-bottom:env(safe-area-inset-bottom);background:#111116}
.sheet-head{height:auto;min-height:72px;display:block;padding:10px 17px 12px;border-bottom:1px solid #ffffff12}
.sheet-handle{width:38px;height:4px;border-radius:8px;background:#ffffff66;margin:0 auto 10px}
.sheet-title-row{display:flex;align-items:center;justify-content:space-between}
.sheet-title-main{font-size:17px;font-weight:800}.sheet-subtitle{font-size:11px;color:#ffffff9e;margin-top:3px}
.comments-list{padding:8px 16px}.comment{gap:11px;padding:13px 0}
.comment .avatar{height:43px;width:43px}.comment-user{font-size:12px;font-weight:650}
.comment-text{font-size:14px;line-height:1.42;margin-top:5px}.comment-meta{gap:13px;font-size:11px;margin-top:8px}
.reply{margin-left:30px;border-left:2px solid #ffffff20;padding-left:12px}
.comment-input{padding:10px 14px;border-top:1px solid #ffffff12}
.create-shell{height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));min-height:0;display:flex;flex-direction:column;gap:0;overflow:hidden}
.create-top{height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 0 8px}
.create-top .page-title{font-size:17px;margin:0;font-weight:800}
.create-top .secondary{height:34px;padding:0 8px;border:0;background:transparent;font-size:13px}
.create-preview{position:relative;flex:1;min-height:180px;background:#09090d;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin:2px -2px 10px}
.create-preview .preview-icon{font-size:48px;color:#ffffffa0}
.create-preview .preview-caption{position:absolute;bottom:14px;left:14px;right:14px;text-align:center;font-size:12px;color:#ffffffb8}
.create-preview video{width:100%;height:100%;object-fit:contain;background:#000}
.create-filters{display:flex;flex-shrink:0;gap:10px;overflow-x:auto;padding:7px 0 12px}
.create-filter{min-width:57px;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;font-size:10px;color:#bbb}
.create-filter .filter-icon{width:48px;height:42px;border-radius:10px;background:linear-gradient(145deg,#383442,#111);display:grid;place-items:center;border:1px solid #ffffff20}
.create-filter.active{color:#25d4e2}.create-filter.active .filter-icon{border:2px solid #25d4e2}
.create-bottom{height:92px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:4px 16px 12px}
.create-bottom input[type=file]{display:none}
.media-pick{width:54px;height:58px;border-radius:12px;background:#ffffff12;display:grid;place-items:center;flex-shrink:0;color:#fff}
.record-button{width:82px;height:82px;flex-shrink:0;border-radius:50%;border:4px solid #fff;background:transparent;display:grid;place-items:center;margin:auto}
.record-button span{width:58px;height:58px;border-radius:50%;background:#fa285e;display:block}
.create-bottom .spacer{flex:1}
.create-hint{text-align:center;color:#8f8d99;font-size:11px;padding:0 0 10px}
.editor-shell{min-height:100%;display:flex;flex-direction:column;gap:12px}
.editor-preview{position:relative;width:min(100%,360px);aspect-ratio:9/16;max-height:53dvh;margin:0 auto;background:#000;overflow:hidden;border-radius:12px}
.editor-preview video{width:100%;height:100%;object-fit:contain}
.editor-overlay-text{position:absolute;left:8%;right:8%;top:40%;text-align:center;font-size:25px;font-weight:900;text-shadow:0 2px 5px #000;overflow-wrap:anywhere;pointer-events:none}
.editor-field{width:100%;min-height:48px;background:#ffffff0c;border:1px solid #ffffff18;border-radius:12px;padding:12px;color:#fff;outline:none}
.editor-post{margin-top:auto;flex-shrink:0}
.primary:disabled{opacity:.4}
@media(min-width:600px){#app.page-mode .page{max-width:560px;margin:0 auto}.sheet{max-width:560px}.create-shell{height:calc(100dvh - 40px)}}

</style></head>
<body>
<div id="auth" class="screen gradient"><div class="auth-wrap"><div class="auth"><div class="brand"><div class="logo"><span class="sym">all_inclusive</span></div><div class="wordmark">Leriz</div></div><p class="tagline">Your world. In motion.</p><div class="auth-card"><div class="segmented"><button id="loginTab" class="active" onclick="setAuth(false)">Log in</button><button id="signupTab" onclick="setAuth(true)">Sign up</button></div><div id="signupFields" class="field hidden"><label>USERNAME</label><div class="input-wrap"><span class="sym">person</span><input id="signupName" placeholder="Choose a username" autocomplete="username"></div></div><div class="field"><label>USERNAME</label><div class="input-wrap"><span class="sym">person</span><input id="loginName" placeholder="Your username" autocomplete="username"></div></div><div class="field"><label>PASSWORD</label><div class="input-wrap"><span class="sym">lock</span><input id="password" type="password" placeholder="Enter your password" autocomplete="current-password"></div></div><button class="primary" id="authButton" onclick="authenticate()">Log in <span class="sym">arrow_forward</span></button><div id="authError" class="error"></div></div><div class="slogan">MAKE EVERY MOMENT YOURS</div></div></div></div>
<div id="app" class="hidden"><header class="topbar"><div class="mini-brand"><span class="sym brand-mark">all_inclusive</span><span>Leriz</span></div><div id="feedTabs" class="feed-tabs"><button id="followingTab" onclick="setFeed('following')">Following</button><button id="forYouTab" class="active" onclick="setFeed('forYou')">For You</button></div><div class="top-actions"><button class="icon-btn" onclick="go('search')" aria-label="Search videos"><span class="sym">search</span></button></div></header><main id="main" class="feed-area"><div id="feed" class="feed-scroller"></div></main><nav class="bottom-nav"><button class="nav-item active" data-page="home" onclick="go('home')"><span class="sym">home</span>Home</button><button class="nav-item" data-page="discover" onclick="go('discover')"><span class="sym">explore</span>Discover</button><button class="nav-item create" data-page="create" onclick="go('create')"><span class="sym">add_box</span>Create</button><button class="nav-item" data-page="inbox" onclick="go('inbox')"><span class="sym">chat_bubble</span>Inbox</button><button class="nav-item" data-page="profile" onclick="go('profile')"><span class="sym">person</span>Profile</button></nav><div id="modal"></div><div id="toastRoot"></div></div>
<script>
const API='https://subhyaloid-kallie-bihourly.ngrok-free.dev';let token=localStorage.getItem('lerizToken')||'',isSignup=false,feedMode='forYou',page='home',videos=[],currentUser=null,commentsVideo=null,comments=[],replyTo=null,editCommentId=null,searchTimer=null,playingId=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nativeReq(method,path,body='',contentType='application/json'){return new Promise((resolve,reject)=>{if(!window.LerizNative){reject(Error('Native API bridge unavailable'));return}let id='r'+Date.now()+Math.random().toString(16).slice(2);window._requests=window._requests||{};window._requests[id]={resolve,reject};LerizNative.request(method,path,body,contentType,token,id);setTimeout(()=>{if(window._requests[id]){delete window._requests[id];reject(Error('Request timed out'))}},35000)})}
window.nativeResponse=(id,status,raw)=>{let x=window._requests&&window._requests[id];if(!x)return;delete window._requests[id];let data;try{data=JSON.parse(raw||'{}')}catch(e){data={error:raw}}if(status>=200&&status<300){x.resolve(data)}else{x.reject(Error(data.error||data.message||('Request failed ('+status+')')))}};
async function api(path,method='GET',body=null){return nativeReq(method,path,body==null?'':JSON.stringify(body),'application/json')}
function toast(msg){$('toastRoot').innerHTML='<div class="toast">'+esc(msg)+'</div>';setTimeout(()=>$('toastRoot').innerHTML='',2600)}
function setAuth(signup){isSignup=signup;$('loginTab').classList.toggle('active',!signup);$('signupTab').classList.toggle('active',signup);$('signupFields').classList.toggle('hidden',!signup);$('loginName').parentElement.parentElement.querySelector('label').textContent=signup?'USERNAME':'USERNAME';$('authButton').innerHTML=(signup?'Create account':'Log in')+' <span class="sym">arrow_forward</span>';$('authError').textContent=''}
async function authenticate(){let username=(isSignup?$('signupName').value:$('loginName').value).trim().replace(/^@/,'');let password=$('password').value;if(!username||!password){$('authError').textContent='Enter your username and password.';return}let b=$('authButton');b.disabled=true;b.textContent='Please wait…';$('authError').textContent='';try{let d=await nativeReq('POST',isSignup?'/api/auth/register':'/api/auth/login',JSON.stringify({username,password,...(isSignup?{displayName:username}:{})}),'application/json');if(!d.token)throw Error(d.error||'Authentication failed');token=d.token;localStorage.setItem('lerizToken',token);await boot()}catch(e){$('authError').textContent=e.message}finally{b.disabled=false;b.innerHTML=(isSignup?'Create account':'Log in')+' <span class="sym">arrow_forward</span>'}}
async function boot(){try{let d=await api('/api/me');currentUser=d.user||d;$('auth').classList.add('hidden');$('app').classList.remove('hidden');go('home');loadFeed()}catch(e){token='';localStorage.removeItem('lerizToken');$('auth').classList.remove('hidden');$('app').classList.add('hidden');if(e.message) $('authError').textContent=e.message}}
function setFeed(mode){feedMode=mode;$('forYouTab').classList.toggle('active',mode==='forYou');$('followingTab').classList.toggle('active',mode==='following');loadFeed()}
function videoURL(v){let u=v.videoURL||v.videoUrl||v.url||('/api/videos/'+v.id+'/file');return u.startsWith('http')?u:API+(u.startsWith('/')?u:'/'+u)}
function avatar(u,name){let url=u&&(u.avatarURL||u.avatar_url);return url?'<img class="avatar" src="'+esc(url.startsWith('http')?url:API+(url.startsWith('/')?url:'/'+url))+'" onerror="this.outerHTML=\'<span class=avatar>\'+\'\'+\'</span>\'">':'<div class="avatar">'+esc((name||'L').slice(0,1).toUpperCase())+'</div>'}
async function loadFeed(){if(page!=='home')return;$('feed').innerHTML='<div class="loading"><span class="spinner"></span>Loading videos…</div>';try{let d=await api('/api/feed?mode='+encodeURIComponent(feedMode)+'&limit=100&offset=0');videos=d.videos||[];renderFeed()}catch(e){$('feed').innerHTML='<div class="empty"><span class="sym">cloud_off</span><b>Could not load videos</b><p>'+esc(e.message)+'</p><button class="secondary" onclick="loadFeed()">Try again</button></div>'}}
function renderFeed(){if(!videos.length){$('feed').innerHTML='<div class="empty"><span class="sym">movie</span><b>No videos available</b><p>When creators upload videos, they will appear here.</p><button class="secondary" onclick="go(\'create\')">Upload a video</button></div>';return}$('feed').innerHTML=videos.map((v,i)=>{let u=v.user||{},name=u.displayName||u.display_name||u.username||'Creator',handle=u.username||'user',id=String(v.id),liked=!!v.likedByMe,saved=!!v.savedByMe;return '<article class="clip" data-id="'+esc(id)+'"><video src="'+esc(videoURL(v))+'" playsinline loop preload="'+(i<2?'auto':'metadata')+'" onclick="togglePlayback(this)" onended="this.currentTime=0;this.play()"></video><div class="play-indicator"><span class="sym">play_arrow</span></div><div class="clip-content"><div class="creator">'+avatar(u,name)+'<span>'+esc(name)+'</span><button class="follow" onclick="followUser(\''+esc(handle)+'\',this)">Follow</button></div><div class="caption">'+esc(v.caption||'')+'</div><div class="audio"><span class="sym">music_note</span><span>original audio · '+esc(handle)+'</span></div></div><div class="actions"><button class="action '+(liked?'liked':'')+'" onclick="likeVideo(\''+esc(id)+'\',this)"><span class="sym '+(liked?'filled':'')+'">'+(liked?'favorite':'favorite_border')+'</span><span>'+fmt(v.likes||0)+'</span></button><button class="action" onclick="openComments(\''+esc(id)+'\')"><span class="sym">chat_bubble</span><span>'+fmt(v.comments||0)+'</span></button><button class="action '+(saved?'liked':'')+'" onclick="saveVideo(\''+esc(id)+'\',this)"><span class="sym '+(saved?'filled':'')+'">'+(saved?'bookmark':'bookmark_border')+'</span><span>Save</span></button><button class="action" onclick="shareVideo(\''+esc(id)+'\')"><span class="sym">share</span><span>Share</span></button></div></article>'}).join('');observeVideos()}
function fmt(n){n=Number(n)||0;return n>=1000000?(n/1e6).toFixed(1)+'M':n>=1000?(n/1e3).toFixed(1)+'K':String(n)}
let observer;function observeVideos(){if(observer)observer.disconnect();observer=new IntersectionObserver(entries=>entries.forEach(e=>{let v=e.target.querySelector('video');if(e.isIntersecting&&e.intersectionRatio>.6){playingId=e.target.dataset.id;v.play().catch(()=>{})}else v.pause()}),{threshold:[.2,.6,.9]});document.querySelectorAll('.clip').forEach(el=>observer.observe(el))}
function togglePlayback(v){if(v.paused){v.play();v.parentElement.querySelector('.play-indicator').classList.remove('show')}else{v.pause();v.parentElement.querySelector('.play-indicator').classList.add('show')}}
async function likeVideo(id,btn){try{let d=await api('/api/videos/'+encodeURIComponent(id)+'/like','POST',{});let v=videos.find(x=>String(x.id)===id);if(v){v.likedByMe=d.liked??!v.likedByMe;v.likes=d.likes??(Number(v.likes||0)+(v.likedByMe?1:-1))}btn.classList.toggle('liked',!!v?.likedByMe);btn.querySelector('.sym').textContent=v?.likedByMe?'favorite':'favorite_border';btn.querySelector('.sym').classList.toggle('filled',!!v?.likedByMe);btn.lastElementChild.textContent=fmt(v?.likes||d.likes||0)}catch(e){toast(e.message)}}
async function saveVideo(id,btn){try{let d=await api('/api/videos/'+encodeURIComponent(id)+'/save','POST',{});let v=videos.find(x=>String(x.id)===id);if(v)v.savedByMe=d.saved??!v.savedByMe;btn.classList.toggle('liked',!!v?.savedByMe);btn.querySelector('.sym').textContent=v?.savedByMe?'bookmark':'bookmark_border';btn.querySelector('.sym').classList.toggle('filled',!!v?.savedByMe);toast(v?.savedByMe?'Saved':'Removed from saved')}catch(e){toast(e.message)}}
async function followUser(username,btn){try{let d=await api('/api/users/'+encodeURIComponent(username)+'/follow','POST',{username});btn.textContent=(d.following===false||d.followed===false)?'Follow':'Following';toast(btn.textContent==='Following'?'Following @'+username:'Unfollowed @'+username)}catch(e){toast(e.message)}}
function shareVideo(id){let url=API+'/api/videos/'+encodeURIComponent(id)+'/file';if(navigator.share)navigator.share({title:'Leriz video',url}).catch(()=>{});else toast('Video link: '+url)}
function go(next){page=next;$('app').classList.toggle('page-mode',next!=='home');$('feedTabs').classList.toggle('hidden',next!=='home');document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===next));let main=$('main');if(next==='home'){main.className='feed-area';if(!$('feed'))main.innerHTML='<div id="feed" class="feed-scroller"></div>';else $('feed').className='feed-scroller';$('app').classList.remove('page-mode');$('feedTabs').classList.remove('hidden');if(!$('feed').children.length)loadFeed();return}main.className='feed-area';main.innerHTML='<section id="pageContent" class="page"></section>';let p=$('pageContent');if(next==='discover')renderDiscover(p);else if(next==='search')renderSearch(p);else if(next==='create')renderCreate(p);else if(next==='profile')renderProfile(p);else if(next==='inbox')p.innerHTML='<div class="empty"><span class="sym">forum</span><b>Inbox</b><p>Messages will appear here when available.</p></div>'}
function renderDiscover(p){p.innerHTML='<div class="page-title">Discover</div><div class="searchbox"><span class="sym">search</span><input id="discoverQuery" placeholder="Search videos, creators, hashtags" oninput="searchDiscover(this.value)"></div><div class="chips"><button class="chip" onclick="searchDiscover(\'#foryou\')">For You</button><button class="chip" onclick="searchDiscover(\'#trending\')">Trending now</button><button class="chip" onclick="searchDiscover(\'#music\')">Music</button></div><div id="discoverResults" class="video-grid"></div><div id="discoverStatus" class="muted">Search videos and creators</div>';searchDiscover('')}
async function searchDiscover(q){let out=$('discoverResults');if(!out)return;clearTimeout(searchTimer);searchTimer=setTimeout(async()=>{try{let d=await api('/api/feed?mode=discover&limit=100&offset=0');let rows=d.videos||[];if(q&&q[0]!=='#')rows=rows.filter(v=>JSON.stringify(v).toLowerCase().includes(q.toLowerCase()));out.innerHTML=rows.map(v=>'<div class="grid-video" onclick="openGridVideo(\''+esc(v.id)+'\')"><video src="'+esc(videoURL(v))+'" muted playsinline preload="metadata"></video><span class="views">▶ '+fmt(v.views||0)+'</span></div>').join('');$('discoverStatus').textContent=rows.length?rows.length+' videos':'No videos found';out.querySelectorAll('video').forEach(v=>v.addEventListener('loadedmetadata',()=>{try{v.currentTime=Math.min(1,v.duration/3)}catch(e){}}))}catch(e){$('discoverStatus').textContent=e.message}},280)}
function openGridVideo(id){go('home');setTimeout(()=>{let el=[...document.querySelectorAll('.clip')].find(x=>x.dataset.id===String(id));if(el)el.scrollIntoView({behavior:'smooth'})},150)}
function renderSearch(p){p.innerHTML='<div class="page-title">Search</div><div class="searchbox"><span class="sym">search</span><input id="searchInput" placeholder="Search videos and creators" oninput="searchDiscover(this.value)"></div><div class="video-grid" id="discoverResults"></div><div id="discoverStatus" class="muted">Start typing to search</div>'}
let selectedCameraFilter='None',selectedVideoFile=null,editorOverlayText='';
function renderCreate(p){
 selectedVideoFile=null;editorOverlayText='';
 p.innerHTML='<div class="create-shell"><div class="create-top"><button class="secondary" onclick="go(\'home\')">Cancel</button><div class="page-title">Create</div><button class="secondary" id="createNext" onclick="openVideoEditor()" disabled>Next</button></div><div class="create-preview" id="createPreview"><span class="sym preview-icon">videocam</span><div class="preview-caption" id="previewCaption">Record a video or choose one from your library</div></div><div class="create-filters">'+['None','Glasses','Cat','Crown','Dog','Robot'].map(function(x,i){return '<button class="create-filter '+(i===0?'active':'')+'" onclick="selectCameraFilter(\''+x+'\',this)"><span class="filter-icon sym">'+['camera_alt','eyeglasses','pets','workspace_premium','pets','smart_toy'][i]+'</span>'+x+'</button>'}).join('')+'</div><div class="create-bottom"><button class="media-pick" onclick="pickVideoFromLibrary()" aria-label="Choose video"><span class="sym">photo_library</span></button><input id="videoFile" type="file" accept="video/*" capture="environment" onchange="previewSelectedVideo(this)"><span class="spacer"></span><button class="record-button" onclick="openCameraCapture()" aria-label="Record video"><span></span></button><span class="spacer"></span><button class="media-pick" onclick="pickVideoFromLibrary()" aria-label="Import video"><span class="sym">add_photo_alternate</span></button></div><div class="create-hint" id="createHint">Record a video with your camera</div></div>';
}
function pickVideoFromLibrary(){let input=$('videoFile');input.removeAttribute('capture');input.click()}
function selectCameraFilter(name,btn){selectedCameraFilter=name;document.querySelectorAll('.create-filter').forEach(function(x){x.classList.remove('active')});btn.classList.add('active');toast(name==='None'?'Original camera selected':name+' effect selected')}
function previewSelectedVideo(input){let f=input.files&&input.files[0];if(!f)return;if(!f.type.startsWith('video/')){toast('Please choose a video');input.value='';return}selectedVideoFile=f;let box=$('createPreview');box.innerHTML='<video id="selectedPreview" controls playsinline></video><div class="preview-caption">Video selected · tap Next to edit</div>';let v=$('selectedPreview');v.src=URL.createObjectURL(f);v.play().catch(function(){});$('createNext').disabled=false;$('createHint').textContent=f.name}
function openCameraCapture(){let input=$('videoFile');input.value='';input.setAttribute('accept','video/*');input.setAttribute('capture','environment');input.click()}
function openVideoEditor(){if(!selectedVideoFile){toast('Record or choose a video first');return}let p=$('pageContent');let url=URL.createObjectURL(selectedVideoFile);p.innerHTML='<div class="create-top"><button class="secondary" onclick="renderCreate($(\'pageContent\') )">Back</button><div class="page-title">Edit video</div><button class="secondary" onclick="go(\'home\')">Cancel</button></div><div class="editor-shell"><div class="editor-preview"><video id="editorVideo" src="'+url+'" playsinline controls></video><div class="editor-overlay-text" id="editorOverlayText"></div></div><input class="editor-field" id="editorText" placeholder="Add text on video…" oninput="editorOverlayText=this.value;$(\'editorOverlayText\').textContent=this.value"><textarea class="editor-field" id="videoCaption" placeholder="Write a caption…" rows="3"></textarea><div class="muted">Preview your video, add text, and write a caption.</div><button class="primary editor-post" id="uploadBtn" onclick="uploadVideo()">Post video <span class="sym">cloud_upload</span></button><div id="uploadStatus" class="muted"></div></div>'}
async function uploadVideo(){if(!selectedVideoFile){toast('Choose a video first');return}if(!selectedVideoFile.type.startsWith('video/')){toast('Please choose a video file');return}if(selectedVideoFile.size>150*1024*1024){toast('Video must be under 150 MB');return}let btn=$('uploadBtn');if(btn){btn.disabled=true;btn.textContent='Uploading…'}$('uploadStatus').textContent='Preparing video…';try{let base64=await new Promise(function(resolve,reject){let reader=new FileReader();reader.onload=function(){resolve(String(reader.result).split(',')[1]||'')};reader.onerror=reject;reader.readAsDataURL(selectedVideoFile)});let id='u'+Date.now();window._requests=window._requests||{};window._requests[id]={resolve:function(d){toast('Video posted');selectedVideoFile=null;go('home');loadFeed()},reject:function(e){if(btn)btn.disabled=false;$('uploadStatus').textContent=e.message||'Upload failed';toast(e.message||'Upload failed')}};let cap=$('videoCaption')?$('videoCaption').value:'';LerizNative.uploadVideo(cap,selectedVideoFile.name,base64,token,id);$('uploadStatus').textContent='Uploading video…'}catch(e){if(btn)btn.disabled=false;$('uploadStatus').textContent=e.message||'Upload failed';toast(e.message||'Upload failed')}}
async function renderProfile(p){p.innerHTML='<div class="loading"><span class="spinner"></span>Loading profile…</div>';try{let d=await api('/api/me'),u=d.user||d;currentUser=u;let name=u.displayName||u.display_name||u.username||'Your profile';p.innerHTML='<div class="page-title">Profile</div><div class="profile-head">'+avatar(u,name)+'<div><div class="profile-name">'+esc(name)+'</div><div class="muted">@'+esc(u.username||'user')+'</div></div></div><div class="stats"><div class="stat"><b>'+fmt(u.followers||0)+'</b><span>Followers</span></div><div class="stat"><b>'+fmt(u.following||0)+'</b><span>Following</span></div><div class="stat"><b>'+fmt(u.likes||0)+'</b><span>Likes</span></div></div><p class="profile-bio">'+esc(u.bio||'Capture your world, your way.')+'</p><div class="profile-buttons"><button class="secondary" onclick="editProfile()">Edit profile</button><button class="secondary" onclick="loadMyVideos()">Share videos</button><button class="secondary" onclick="logout()">Log out</button></div><div class="profile-tabs"><button class="active" id="profileVideosTab" onclick="loadMyVideos()">Videos</button><button id="profileSavedTab" onclick="loadSavedVideos()">Saved</button></div><div id="profileExtra"><div class="loading"><span class="spinner"></span>Loading videos…</div></div>';loadMyVideos()}catch(e){p.innerHTML='<div class="empty"><b>Could not load profile</b><p>'+esc(e.message)+'</p><button class="secondary" onclick="renderProfile($(\'pageContent\'))">Try again</button></div>'}}
function editProfile(){let u=currentUser||{};$('profileExtra').innerHTML='<div class="panel"><h3>Edit profile</h3><label>DISPLAY NAME</label><input id="editDisplay" value="'+esc(u.displayName||u.display_name||'')+'"><label>USERNAME</label><input id="editUsername" value="'+esc(u.username||'')+'"><label>BIO</label><textarea id="editBio">'+esc(u.bio||'')+'</textarea><button class="primary" onclick="saveProfile()">Save changes</button></div>'}
async function saveProfile(){try{let d=await api('/api/me','PATCH',{displayName:$('editDisplay').value,username:$('editUsername').value,bio:$('editBio').value});currentUser=d.user||d;toast('Profile saved');renderProfile($('pageContent'))}catch(e){toast(e.message)}}
async function loadMyVideos(){try{$('profileVideosTab')?.classList.add('active');$('profileSavedTab')?.classList.remove('active');let d=await api('/api/feed?mode=profile&limit=100&offset=0');let rows=(d.videos||[]).filter(v=>!currentUser?.username||v.user?.username===currentUser.username);$('profileExtra').innerHTML=rows.length?'<div class="profile-grid">'+rows.map(v=>'<div class="grid-video" onclick="openGridVideo(\''+esc(v.id)+'\')"><video src="'+esc(videoURL(v))+'" muted playsinline preload="auto" onloadeddata="this.classList.add(\'ready\')"></video><span class="views"><span class="sym">visibility</span>'+fmt(v.views||v.viewCount||v.view_count||0)+'</span></div>').join('')+'</div>':'<div class="empty"><span class="sym">movie</span><b>No videos yet</b><p>Your posted videos will appear here.</p></div>'; }catch(e){$('profileExtra').innerHTML='<div class="empty">Could not load videos.</div>'}}
async function loadSavedVideos(){try{$('profileSavedTab')?.classList.add('active');$('profileVideosTab')?.classList.remove('active');let d=await api('/api/saved');let rows=d.videos||[];$('profileExtra').innerHTML=rows.length?'<div class="profile-grid">'+rows.map(v=>'<div class="grid-video" onclick="openGridVideo(\''+esc(v.id)+'\')"><video src="'+esc(videoURL(v))+'" muted playsinline preload="auto" onloadeddata="this.classList.add(\'ready\')"></video><span class="views"><span class="sym">visibility</span>'+fmt(v.views||v.viewCount||v.view_count||0)+'</span></div>').join('')'')+'</div>':'<div class="empty"><span class="sym">bookmark</span><b>No saved videos</b></div>'}catch(e){toast(e.message)}}
function logout(){token='';localStorage.removeItem('lerizToken');$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('password').value='';$('loginName').value='';currentUser=null}
async function openComments(id){commentsVideo=id;replyTo=null;editCommentId=null;$('modal').innerHTML='<div class="overlay" onclick="if(event.target===this)closeComments()"><section class="sheet"><div class="sheet-head"><div class="sheet-handle"></div><div class="sheet-title-row"><div><div class="sheet-title-main">Comments</div><div class="sheet-subtitle" id="commentsCreator"></div></div><button class="icon-btn" onclick="closeComments()"><span class="sym">close</span></button></div></div><div class="comments-list" id="commentsList"><div class="loading"><span class="spinner"></span>Loading comments…</div></div><div id="replyLabel" class="muted" style="padding:0 15px"></div><div class="comment-input"><input id="commentInput" placeholder="Add a comment…" onkeydown="if(event.key===\'Enter\')postComment()"><button class="send" onclick="postComment()"><span class="sym">send</span></button></div></section></div>';try{let clip=videos.find(v=>String(v.id)===String(id));$('commentsCreator').textContent=clip?(clip.user?.displayName||clip.user?.display_name||clip.user?.username||''):'';let d=await api('/api/videos/'+encodeURIComponent(id)+'/comments');comments=d.comments||[];renderComments()}catch(e){$('commentsList').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function closeComments(){$('modal').innerHTML='';commentsVideo=null}
function renderComments(){let list=$('commentsList');if(!list)return;if(!comments.length){list.innerHTML='<div class="empty"><span class="sym">chat_bubble</span><b>No comments yet</b><p>Be the first to comment.</p></div>';return}let roots=comments.filter(c=>!c.parentId&&!c.parent_id);let children=comments.filter(c=>c.parentId||c.parent_id);list.innerHTML=roots.map(c=>commentHTML(c,false)+children.filter(r=>String(r.parentId||r.parent_id)===String(c.id)).map(r=>commentHTML(r,true)).join('')).join('')}
function commentHTML(c,reply){let user=c.user||{},name=user.username||c.username||'user',mine=String(user.username||c.username||'').toLowerCase()===String(currentUser?.username||'').toLowerCase();return '<div class="comment '+(reply?'reply':'')+'" ontouchstart="beginCommentHold(event,\''+esc(c.id)+'\')" ontouchend="endCommentHold()" ontouchmove="endCommentHold()" oncontextmenu="event.preventDefault();showCommentActions(\''+esc(c.id)+'\');return false">'+avatar(user,name)+'<div class="comment-body"><div class="comment-user">@'+esc(name)+'</div><div class="comment-text">'+esc(c.text||c.comment||'')+'</div><div class="comment-meta"><span>Just now</span><button onclick="setReply(\''+esc(c.id)+'\',\''+esc(name)+'\')">Reply</button>'+(mine?'':'')+'</div></div><button class="comment-like" onclick="likeComment(\''+esc(c.id)+'\',this)"><span class="sym">favorite_border</span>'+fmt(c.likes||0)+'</button></div>'}
function setReply(id,name){replyTo=id;$('replyLabel').textContent='Replying to @'+name+' · tap to cancel';$('commentInput').placeholder='Write a reply…';$('commentInput').focus();$('replyLabel').onclick=()=>{replyTo=null;$('replyLabel').textContent='';$('commentInput').placeholder='Add a comment…'}}
async function postComment(){let input=$('commentInput'),text=input.value.trim();if(!text||!commentsVideo)return;try{await api('/api/videos/'+encodeURIComponent(commentsVideo)+'/comments','POST',{text,...(replyTo?{parentId:replyTo}:{})});input.value='';replyTo=null;$('replyLabel').textContent='';let d=await api('/api/videos/'+encodeURIComponent(commentsVideo)+'/comments');comments=d.comments||[];renderComments()}catch(e){toast(e.message)}}
async function likeComment(id,btn){try{let d=await api('/api/comments/'+encodeURIComponent(id)+'/like','POST',{});btn.querySelector('.sym').textContent=(d.liked?'favorite':'favorite_border');btn.style.color=d.liked?'#ff4f9a':''}catch(e){toast(e.message)}}
let commentHoldTimer=null;function beginCommentHold(event,id){endCommentHold();commentHoldTimer=setTimeout(()=>{showCommentActions(id)},520)}function endCommentHold(){if(commentHoldTimer){clearTimeout(commentHoldTimer);commentHoldTimer=null}}function showCommentActions(id){endCommentHold();let c=comments.find(x=>String(x.id)===String(id));if(!c)return;let u=c.user||{},mine=String(u.username||c.username||'').toLowerCase()===String(currentUser?.username||'').toLowerCase();let existing=$('commentActionsBackdrop');if(existing)existing.remove();let back=document.createElement('div');back.id='commentActionsBackdrop';back.className='comment-actions-backdrop';back.onclick=()=>back.remove();let menu=document.createElement('div');menu.className='comment-actions-pop';menu.innerHTML='<button onclick="setReply(\''+esc(id)+'\',\''+esc(u.username||c.username||'user')+'\');document.getElementById(\'commentActionsBackdrop\').remove()"><span class="sym">reply</span>Reply</button>'+(mine?'<button onclick="editComment(\''+esc(id)+'\',\''+String(c.text||c.comment||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")+'\');document.getElementById(\'commentActionsBackdrop\').remove()"><span class="sym">edit</span>Edit comment</button><button class="danger" onclick="deleteComment(\''+esc(id)+'\');document.getElementById(\'commentActionsBackdrop\').remove()"><span class="sym">delete</span>Delete comment</button>':'')+'<button onclick="document.getElementById(\'commentActionsBackdrop\').remove()"><span class="sym">close</span>Cancel</button>';back.appendChild(menu);document.body.appendChild(back)}
async function editComment(id,old){let value=prompt('Edit comment',old);if(value===null||!value.trim())return;try{await api('/api/comments/'+encodeURIComponent(id),'PATCH',{text:value.trim()});let d=await api('/api/videos/'+encodeURIComponent(commentsVideo)+'/comments');comments=d.comments||[];renderComments()}catch(e){toast(e.message)}}
async function deleteComment(id){if(!confirm('Delete this comment?'))return;try{await api('/api/comments/'+encodeURIComponent(id),'DELETE',{});let d=await api('/api/videos/'+encodeURIComponent(commentsVideo)+'/comments');comments=d.comments||[];renderComments()}catch(e){toast(e.message)}}
window.addEventListener('load',()=>{if(token)boot()});
</script></body></html>
