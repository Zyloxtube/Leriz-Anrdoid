/* Feed geometry and overlays aligned to the iOS SwiftUI layout. */
#app{position:relative;isolation:isolate}
.topbar{position:absolute;top:0;left:0;right:0;height:auto;min-height:99px;flex-shrink:0;justify-content:space-between;gap:9px;padding:49px 18px 12px;background:linear-gradient(180deg,#000b 0%,#0005 65%,transparent 100%);border:0;z-index:6}
.mini-brand{display:flex;align-items:center;gap:5px;flex-shrink:0;font-size:25px;letter-spacing:-1.2px;white-space:nowrap}
.brand-mark{font-size:25px;background:linear-gradient(135deg,var(--cyan),var(--purple),var(--pink));color:transparent;background-clip:text;-webkit-background-clip:text}
.feed-tabs{position:static;inset:auto;top:auto;left:auto;right:auto;height:30px;display:flex;align-items:center;justify-content:center;gap:13px;flex:1;min-width:0;background:none;pointer-events:auto}
.feed-tabs button{height:30px;min-width:0;padding:0 0 5px;background:none;color:#ffffffad;font-size:13px;font-weight:650;white-space:nowrap}
.feed-tabs button.active{color:#fff;font-weight:800}
.feed-tabs button.active:after{height:3px;width:28px;bottom:0;background:var(--cyan);border-radius:999px}
.top-actions{gap:0;flex-shrink:0}
.icon-btn{height:32px;min-width:30px;width:30px;border-radius:50%;background:transparent;padding:0}
.icon-btn .sym{font-size:23px}
.feed-area{position:absolute;inset:0;width:100%;height:100%;flex:none;min-height:0;overflow:hidden}
.feed-scroller{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain}
.clip{height:100dvh;min-height:100dvh;position:relative;scroll-snap-align:start;border-radius:0}
.clip-content{left:15px;right:75px;bottom:112px}
.actions{right:12px;bottom:118px;gap:20px}
.bottom-nav{position:absolute;left:0;right:0;bottom:0;height:105px;flex-shrink:0;justify-content:space-around;padding:20px 24px 28px;background:linear-gradient(0deg,#000 0%,#000e 53%,#0000 100%);border-top:0;z-index:5}
.nav-item{gap:5px;font-size:10px}
.nav-item .sym{font-size:21px}
.nav-item.create .sym{font-size:26px;padding:3px 8px;border-radius:9px}
#app.page-mode .topbar,#app.page-mode .bottom-nav{display:none}
#app.page-mode #main{position:absolute;inset:0;width:100%;height:100%;overflow:auto}
#app.page-mode .page{height:100%;padding:20px 17px 30px;max-width:none}
@media(min-width:600px){.clip{height:100dvh;min-height:100dvh;max-width:none;margin:0}.clip-content{left:15px;right:75px}.actions{right:12px}}

/* iOS-matched feed, profile, camera composer, and comments sheet */
.topbar{padding-top:calc(env(safe-area-inset-top) + 12px);min-height:calc(env(safe-area-inset-top) + 58px)}
.bottom-nav{height:calc(env(safe-area-inset-bottom) + 78px);padding:12px 22px calc(env(safe-area-inset-bottom) + 15px)}
.clip-content{bottom:calc(env(safe-area-inset-bottom) + 104px);left:16px;right:76px}
.actions{bottom:calc(env(safe-area-inset-bottom) + 112px);right:13px;gap:19px}
.clip video{object-fit:contain;background:#000}
.overlay{align-items:flex-end;background:#0008}
.sheet{height:50dvh;max-height:98dvh;border-radius:23px 23px 0 0;padding-bottom:env(safe-area-inset-bottom);background:#111116}
.sheet-head{height:auto;min-height:74px;display:block;padding:10px 17px 11px}
.sheet-handle{width:38px;height:4px;border-radius:8px;background:#ffffff66;margin:0 auto 10px}
.sheet-title-row{display:flex;align-items:center;justify-content:space-between}
.sheet-title-main{font-size:17px;font-weight:800}
.sheet-subtitle{font-size:11px;color:#ffffff9e;margin-top:3px}
.comment{gap:11px;padding:13px 0}.comment .avatar{height:43px;width:43px}
.comment-user{font-size:12px;font-weight:650}.comment-text{font-size:14px;line-height:1.42;margin-top:5px}
.comment-meta{gap:13px;font-size:11px;margin-top:8px}.comment-meta button{font-size:11px}
.reply{margin-left:30px;border-left:2px solid #ffffff20;padding-left:12px}
.page{padding-top:calc(env(safe-area-inset-top) + 18px)!important}
.page-title{font-size:23px;letter-spacing:-.45px;margin-bottom:22px}
.profile-head{gap:16px;margin:18px 0 20px;align-items:center}
.profile-head .avatar{width:88px;height:88px;font-size:28px}
.profile-name{font-size:20px;font-weight:750;letter-spacing:-.3px}
.stats{padding:15px 0;border-top:1px solid #ffffff12;border-bottom:1px solid #ffffff12;margin:12px 0 14px}
.stat b{font-size:18px;color:white}.stat span{font-size:11px;color:#aaa;margin-top:4px}
.profile-buttons{gap:10px;margin:17px 0}.profile-buttons .secondary{height:43px;border-radius:9px;font-size:13px}
.profile-buttons .secondary:first-child{background:#ffffff14;border-color:transparent}
.profile-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin:18px -17px 0}
.profile-grid .grid-video{aspect-ratio:9/16;border-radius:0}
.create-shell{height:100%;min-height:0;display:flex;flex-direction:column;gap:0}
.create-top{display:flex;align-items:center;justify-content:space-between;padding:0 2px 14px}
.create-top .page-title{margin:0;font-size:18px}
.create-preview{position:relative;flex:1;min-height:230px;background:linear-gradient(145deg,#17121f,#08080c 58%,#101b20);border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin:0 -7px 12px}
.create-preview .preview-icon{font-size:52px;color:#ffffffa0}
.create-preview .preview-caption{position:absolute;bottom:14px;left:15px;right:15px;text-align:center;font-size:12px;color:#ffffffb8}
.create-filters{display:flex;gap:10px;overflow-x:auto;padding:8px 0 13px}
.create-filter{min-width:57px;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;font-size:10px;color:#bbb}
.create-filter .filter-icon{width:48px;height:42px;border-radius:10px;background:linear-gradient(145deg,#383442,#111);display:grid;place-items:center;border:1px solid #ffffff20}
.create-filter.active{color:var(--cyan)}.create-filter.active .filter-icon{border:2px solid var(--cyan)}
.create-bottom{display:flex;align-items:center;gap:14px;padding:8px 0 16px}.create-bottom input[type=file]{display:none}
.media-pick{width:54px;height:58px;border-radius:12px;background:#ffffff12;display:grid;place-items:center;flex-shrink:0}
.record-button{width:82px;height:82px;border-radius:50%;border:4px solid #fff;background:transparent;display:grid;place-items:center;margin:auto}
.record-button span{width:58px;height:58px;border-radius:50%;background:#fa285e;display:block}
.create-bottom .spacer{flex:1}
.create-caption{width:100%;min-height:58px;background:#ffffff0d;border:1px solid #ffffff18;border-radius:13px;padding:12px;color:#fff;resize:vertical}
@media(min-width:600px){.sheet{max-width:560px;margin:0 auto}.page{padding-top:24px!important}}


/* Final page system: full-screen SwiftUI-like layouts, no feed chrome on pushed pages */
#app.page-mode .topbar,#app.page-mode .bottom-nav,#app.page-mode #feedTabs{display:none!important}
#app.page-mode #main{position:absolute;inset:0;width:100%;height:100dvh;overflow:hidden;background:#050508}
#app.page-mode .page{box-sizing:border-box;width:100%;height:100dvh;max-width:none;margin:0;overflow-y:auto;overscroll-behavior:contain;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 24px)!important;background:#050508}
.page-title{font-size:23px;font-weight:800;letter-spacing:-.45px;margin:8px 0 20px}
.searchbox{height:48px;border-radius:14px;background:#ffffff0c;border:1px solid #ffffff15}
.chips{padding:14px 0 16px}.chip{border-radius:22px;padding:9px 14px;background:#ffffff0a}
.video-grid,.profile-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin:14px -18px 0}
.grid-video{aspect-ratio:9/16;border-radius:0}
.profile-head{display:flex;align-items:center;gap:16px;margin:18px 0 20px}
.profile-head .avatar{width:88px;height:88px;flex-shrink:0;font-size:27px}
.profile-name{font-size:20px;font-weight:750;letter-spacing:-.3px}

<script>
const API='https://subhyaloid-kallie-bihourly.ngrok-free.dev';let token=(window.LerizNative&&window.LerizNative.getSavedToken())||localStorage.getItem('lerizToken')||'',isSignup=false,feedMode='forYou',page='home',videos=[],currentUser=null,commentsVideo=null,comments=[],replyTo=null,editCommentId=null,searchTimer=null,playingId=null;

function setFeed(mode){feedMode=mode;$('forYouTab').classList.toggle('active',mode==='forYou');$('followingTab').classList.toggle('active',mode==='following');loadFeed()}

function avatar(u,name){let url=u&&(u.avatarURL||u.avatar_url);return url?'<img class="avatar" src="'+esc(url.startsWith('http')?url:API+(url.startsWith('/')?url:'/'+url))+'" onerror="this.outerHTML=\'<span class=avatar>\'+\'\'+\'</span>\'">':'<div class="avatar">'+esc((name||'L').slice(0,1).toUpperCase())+'</div>'}
async function loadFeed(){if(page!=='home')return;$('feed').innerHTML='<div class="loading"><span class="spinner"></span>Loading videos…</div>';try{let d=await api('/api/feed?mode='+encodeURIComponent(feedMode)+'&limit=100&offset=0');videos=d.videos||[];renderFeed()}catch(e){$('feed').innerHTML='<div class="empty"><span class="sym">cloud_off</span><b>Could not load videos</b><p>'+esc(e.message)+'</p><button class="secondary" onclick="loadFeed()">Try again</button></div>'}}

 for(let i=0;i<bytes.length;i+=step)binary+=String.fromCharCode.apply(null,bytes.subarray(i,Math.min(i+step,bytes.length)));
 return btoa(binary);
}
async function readBlobBase64(blob){
 if(!blob||typeof blob.size!=='number'||blob.size===0)throw Error('Video chunk is empty or unavailable');
 if(typeof blob.arrayBuffer==='function'){
  try{
   const buffer=await blob.arrayBuffer();
   if(buffer&&buffer.byteLength)return videoBytesToBase64(buffer);
   throw Error('Blob arrayBuffer returned no bytes');
  }catch(e){console.warn('arrayBuffer chunk read failed',e)}
 }
 // Some Android WebViews fail FileReader on picker-backed File.slice() blobs.
 // Fetching a temporary Blob URL uses the browser's blob store as another read path.
 let objectUrl=null;
 try{
  objectUrl=URL.createObjectURL(blob);
  const response=await fetch(objectUrl);
  if(!response.ok)throw Error('Temporary video chunk could not be fetched');
  const buffer=await response.arrayBuffer();
  if(buffer&&buffer.byteLength)return videoBytesToBase64(buffer);
  throw Error('Temporary video chunk returned no bytes');
 }catch(e){console.warn('Blob URL chunk read failed; trying FileReader',e)}
 finally{if(objectUrl)try{URL.revokeObjectURL(objectUrl)}catch(e){}}
 return await new Promise(function(resolve,reject){
  let r=new FileReader();
  r.onload=()=>{let result=String(r.result||''),comma=result.indexOf(',');if(comma<0||!result.slice(comma+1))reject(Error('Video chunk was read as empty data'));else resolve(result.slice(comma+1))};
  r.onerror=()=>reject(Error('Android could not read this video chunk through Blob, URL, or FileReader. Re-select the video and try again.'));
  r.onabort=()=>reject(Error('Video chunk reading was interrupted. Try selecting the video again.'));
  try{r.readAsDataURL(blob)}catch(e){reject(Error('Could not open video chunk: '+(e.message||e)))}
 });
}
async function nativeChunkUpload(file,caption,statusNode){
 if(!window.LerizNative)throw Error('Native upload bridge is outdated. Reinstall the latest Leriz APK.');
 let id='u'+Date.now()+Math.random().toString(16).slice(2),filename=file.name||'leriz-upload.mp4';
 window._requests=window._requests||{};
 let promise=new Promise((resolve,reject)=>{window._requests[id]={resolve,reject};setTimeout(()=>{if(window._requests[id]){delete window._requests[id];reject(Error('Upload timed out. Try a smaller video or check your connection.'))}},240000)});
 // Stream picker-backed files from Android's ContentResolver, avoiding WebView Blob reads.
 if(selectedCameraFilter==='None'&&typeof LerizNative.uploadPickedVideo==='function'){
  try{
   if(LerizNative.uploadPickedVideo(id,filename,caption,token)){
    if(statusNode)statusNode.textContent='Reading video from device…';
    return await promise;
   }
  }catch(e){console.warn('Native picker upload unavailable; using chunk upload',e)}
 }
 if(!LerizNative.beginVideoUpload(id,filename,caption,token))throw Error('Could not prepare upload');
 const chunkSize=256*1024;
 for(let offset=0;offset<file.size;offset+=chunkSize){
  let part=file.slice(offset,Math.min(file.size,offset+chunkSize));
  let b64=await readBlobBase64(part);
  if(!LerizNative.appendVideoUploadChunk(id,b64))throw Error('Could not pass video data to Android');
  if(statusNode)statusNode.textContent='Preparing upload… '+Math.min(100,Math.round((offset+part.size)/file.size*100))+'%';
 }
 if(!LerizNative.finishVideoUpload(id))throw Error('Could not start video upload');
 if(statusNode)statusNode.textContent='Uploading video…';
 return await promise;
}

let videoHoldTimer=null,videoHoldStart=null,suppressVideoClick=false,profileVideosCache=[],savedVideosCache=[];

async function editVideo(id){

 try{
  const d=await api('/api/videos/'+encodeURIComponent(id),'PATCH',{caption:caption.trim()});
  const updated=d.video||d;
  [videos,profileVideosCache,savedVideosCache].forEach(arr=>{const item=arr.find(x=>String(x.id)===String(id));if(item){item.caption=updated.caption??caption.trim();item.description=updated.description??item.description}});
