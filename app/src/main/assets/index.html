.brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:8px}.logo{height:62px;width:62px;border-radius:21px;background:linear-gradient(135deg,var(--cyan),var(--purple),var(--pink));display:grid;place-items:center;box-shadow:0 10px 40px #8b49e44c}.logo .sym{font-size:40px}.wordmark{font-size:38px;font-weight:900;letter-spacing:-1.7px}.tagline{color:#aaa8b7;font-size:14px;text-align:center;margin:0 0 26px}.auth-wrap{height:100%;overflow:auto;display:flex;align-items:center;justify-content:center;padding:30px 22px}.auth{width:100%;max-width:440px}.auth-card{background:#ffffff0a;border:1px solid #ffffff19;border-radius:26px;padding:20px;box-shadow:0 18px 70px #0008;backdrop-filter:blur(16px)}.segmented{display:flex;padding:4px;background:#ffffff0c;border-radius:14px;margin-bottom:20px}.segmented button{width:50%;height:40px;border-radius:11px;background:transparent;color:#aaa}.segmented button.active{background:#ffffff1c;color:#fff;font-weight:700}.field{margin:14px 0}.field label{display:block;color:#aaa8b7;font-size:10px;letter-spacing:1.5px;font-weight:800;margin-bottom:8px}.input-wrap{height:53px;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:15px;background:#ffffff0b;border:1px solid #ffffff19}.input-wrap .sym{font-size:21px;color:#aaa}.input-wrap input{min-width:0;flex:1;background:none;border:0;outline:0;color:white}.primary{width:100%;height:54px;border-radius:16px;background:linear-gradient(100deg,#19bfcf,#8655f6 60%,#ec4ba8);font-weight:800;display:flex;gap:10px;align-items:center;justify-content:center;margin-top:18px}.error{color:#ff777d;text-align:center;font-size:12px;margin:12px 0 0}.slogan{text-align:center;color:#777484;font-size:9px;font-weight:800;letter-spacing:2px;margin-top:30px}

.feed-area{flex:1;min-height:0;position:relative;overflow:hidden}.feed-scroller{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain}.clip{height:100%;height:calc(100dvh - 56px - 66px);min-height:300px;position:relative;scroll-snap-align:start;background:#0d0d13;overflow:hidden}.clip video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0d0d13}.clip:after{content:"";pointer-events:none;position:absolute;inset:0;background:linear-gradient(0deg,#000d,transparent 38%,#0003)}.clip-content{position:absolute;z-index:2;left:15px;right:86px;bottom:20px;text-shadow:0 1px 8px #000;pointer-events:none}.creator{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;pointer-events:auto}.avatar{height:37px;width:37px;border-radius:50%;display:grid;place-items:center;object-fit:cover;background:linear-gradient(135deg,#11c6d6,#8b52fa,#f253aa);border:1.5px solid #fff7;font-weight:800}.follow{background:#fa4f9e;border-radius:8px;font-size:11px;font-weight:800;padding:6px 10px;margin-left:2px}.caption{font-size:14px;line-height:1.4;margin-top:10px;white-space:pre-wrap;overflow-wrap:anywhere}.audio{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:12px;font-weight:650}.actions{position:absolute;z-index:3;right:12px;bottom:28px;display:flex;flex-direction:column;align-items:center;gap:19px}.action{display:flex;align-items:center;flex-direction:column;gap:4px;background:none;text-shadow:0 1px 6px #000}.action .sym{font-size:30px;filter:drop-shadow(0 1px 3px #000)}.action span:last-child{font-size:11px;font-weight:750}.action.liked{color:#ff4f9a}.play-indicator{position:absolute;z-index:2;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .12s}.play-indicator.show{opacity:1}.play-indicator .sym{height:68px;width:68px;border-radius:50%;background:#0008;font-size:36px}.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:36px;color:#aaa}.empty .sym{font-size:50px;color:#8b68ff;margin-bottom:12px}.empty b{color:#fff;font-size:18px}.bottom-nav{height:66px;flex-shrink:0;background:#08080cf7;border-top:1px solid #ffffff12;display:flex;align-items:center;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom);z-index:5}.nav-item{flex:1;height:100%;display:flex;align-items:center;justify-content:center;gap:3px;flex-direction:column;background:none;color:#8e8b9a;font-size:10px;font-weight:700}.nav-item .sym{font-size:24px}.nav-item.active{color:#fff}.nav-item.active .sym{color:#a985ff}.nav-item.create .sym{font-size:29px;background:linear-gradient(110deg,var(--cyan),var(--purple),var(--pink));border-radius:10px;padding:4px;color:#fff}
.page{height:100%;overflow:auto;padding:20px 17px 26px}.page-title{font-size:26px;font-weight:900;letter-spacing:-.7px;margin:2px 0 18px}.searchbox{display:flex;align-items:center;gap:10px;padding:0 14px;height:48px;background:#ffffff0c;border:1px solid var(--line);border-radius:15px}.searchbox input{background:none;border:0;outline:0;flex:1;min-width:0;color:white}.chips{display:flex;gap:9px;overflow:auto;padding:15px 0}.chip{border:1px solid var(--line);background:#ffffff08;padding:9px 13px;border-radius:22px;white-space:nowrap;font-size:12px}.video-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.grid-video{position:relative;aspect-ratio:9/16;background:#15151d;border-radius:7px;overflow:hidden}.grid-video video{width:100%;height:100%;object-fit:cover}.grid-video .views{position:absolute;bottom:5px;left:5px;font-size:10px;text-shadow:0 1px 5px #000}.profile-head{display:flex;align-items:center;gap:14px;margin:8px 0 20px}.profile-head .avatar{height:74px;width:74px;font-size:22px}.profile-name{font-size:20px;font-weight:850}.muted{color:var(--muted);font-size:13px}.stats{display:flex;gap:22px;margin:17px 0}.stat b{display:block;font-size:17px}.stat span{font-size:11px;color:#aaa}.profile-buttons{display:flex;gap:9px}.secondary{border:1px solid #ffffff22;background:#ffffff0b;border-radius:13px;height:43px;padding:0 16px;font-weight:750}.profile-buttons .secondary{flex:1}.panel{background:#ffffff08;border:1px solid var(--line);border-radius:17px;padding:15px;margin:13px 0}.panel input,.panel textarea{width:100%;background:#ffffff0b;border:1px solid #ffffff18;border-radius:12px;padding:12px;color:white;outline:0;margin:5px 0 12px}.panel textarea{min-height:82px;resize:vertical}.panel label{font-size:11px;color:#aaa;display:block}
.overlay{position:absolute;inset:0;z-index:10;background:#0009;display:flex;align-items:flex-end}.sheet{width:100%;max-height:78%;display:flex;flex-direction:column;background:#111116;border:1px solid #ffffff17;border-radius:23px 23px 0 0;overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}.sheet-head{height:55px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 17px;border-bottom:1px solid var(--line);font-weight:850}.comments-list{overflow:auto;flex:1;padding:8px 15px;min-height:80px}.comment{display:flex;gap:9px;padding:12px 0;align-items:flex-start}.comment .avatar{height:33px;width:33px;flex-shrink:0}.comment-body{flex:1;min-width:0}.comment-user{font-size:12px;font-weight:800;color:#c6c3d0}.comment-text{font-size:14px;line-height:1.4;overflow-wrap:anywhere;margin-top:3px}.comment-meta{display:flex;align-items:center;gap:12px;color:#999;font-size:10px;margin-top:7px}.comment-meta button{background:none;color:#aaa;font-size:10px}.reply{margin-left:22px;border-left:2px solid #ffffff1a;padding-left:10px}.comment-like{background:none;color:#999;display:flex;align-items:center;flex-direction:column;font-size:10px;gap:3px}.comment-like .sym{font-size:20px}.comment-input{display:flex;align-items:center;gap:9px;padding:10px 12px;border-top:1px solid var(--line);background:#111116}.comment-input input{flex:1;min-width:0;height:43px;background:#ffffff0d;border:1px solid #ffffff12;border-radius:22px;padding:0 15px;color:white;outline:0}.send{height:42px;width:42px;border-radius:50%;background:linear-gradient(130deg,var(--cyan),var(--purple));display:grid;place-items:center}
.toast{position:absolute;z-index:30;bottom:82px;left:50%;transform:translateX(-50%);padding:11px 16px;border:1px solid #ffffff1d;border-radius:14px;background:#22222a;box-shadow:0 8px 35px #0008;font-size:12px;max-width:90%;text-align:center}.loading{display:flex;align-items:center;justify-content:center;gap:10px;color:#aaa;padding:22px}.spinner{width:18px;height:18px;border:2px solid #ffffff33;border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(min-width:600px){.clip{height:calc(100dvh - 56px - 66px);max-width:560px;margin:0 auto}.page{max-width:700px;margin:0 auto}.feed-tabs{top:56px}.actions{right:calc((100% - min(100%,560px))/2 + 12px)}.clip-content{left:calc((100% - min(100%,560px))/2 + 15px)}}
</style></head>
<body>
<div id="auth" class="screen gradient"><div class="auth-wrap"><div class="auth"><div class="brand"><div class="logo"><span class="sym">all_inclusive</span></div><div class="wordmark">Leriz</div></div><p class="tagline">Your world. In motion.</p><div class="auth-card"><div class="segmented"><button id="loginTab" class="active" onclick="setAuth(false)">Log in</button><button id="signupTab" onclick="setAuth(true)">Sign up</button></div><div id="signupFields" class="field hidden"><label>USERNAME</label><div class="input-wrap"><span class="sym">person</span><input id="signupName" placeholder="Choose a username" autocomplete="username"></div></div><div class="field"><label>USERNAME</label><div class="input-wrap"><span class="sym">person</span><input id="loginName" placeholder="Your username" autocomplete="username"></div></div><div class="field"><label>PASSWORD</label><div class="input-wrap"><span class="sym">lock</span><input id="password" type="password" placeholder="Enter your password" autocomplete="current-password"></div></div><button class="primary" id="authButton" onclick="authenticate()">Log in <span class="sym">arrow_forward</span></button><div id="authError" class="error"></div></div><div class="slogan">MAKE EVERY MOMENT YOURS</div></div></div></div>
<div id="app" class="hidden"><header class="topbar"><div class="mini-brand">Leriz</div><div class="top-actions"><button class="icon-btn" onclick="go('search')"><span class="sym">search</span></button><button class="icon-btn" onclick="go('inbox')"><span class="sym">chat_bubble</span></button></div></header><div id="feedTabs" class="feed-tabs"><button id="forYouTab" class="active" onclick="setFeed('forYou')">For You</button><button id="followingTab" onclick="setFeed('following')">Following</button></div><main id="main" class="feed-area"><div id="feed" class="feed-scroller"></div></main><nav class="bottom-nav"><button class="nav-item active" data-page="home" onclick="go('home')"><span class="sym">home</span>Home</button><button class="nav-item" data-page="discover" onclick="go('discover')"><span class="sym">explore</span>Discover</button><button class="nav-item create" data-page="create" onclick="go('create')"><span class="sym">add_box</span>Create</button><button class="nav-item" data-page="inbox" onclick="go('inbox')"><span class="sym">chat_bubble</span>Inbox</button><button class="nav-item" data-page="profile" onclick="go('profile')"><span class="sym">person</span>Profile</button></nav><div id="modal"></div><div id="toastRoot"></div></div>
<script>
const API='https://subhyaloid-kallie-bihourly.ngrok-free.dev';let token=localStorage.getItem('lerizToken')||'',isSignup=false,feedMode='forYou',page='home',videos=[],currentUser=null,commentsVideo=null,comments=[],replyTo=null,editCommentId=null,searchTimer=null,playingId=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nativeReq(method,path,body='',contentType='application/json'){return new Promise((resolve,reject)=>{if(!window.LerizNative){reject(Error('Native API bridge unavailable'));return}let id='r'+Date.now()+Math.random().toString(16).slice(2);window._requests=window._requests||{};window._requests[id]={resolve,reject};LerizNative.request(method,path,body,contentType,token,id);setTimeout(()=>{if(window._requests[id]){delete window._requests[id];reject(Error('Request timed out'))}},35000)})}
window.nativeResponse=(id,status,raw)=>{let x=window._requests&&window._requests[id];if(!x)return;delete window._requests[id];let data;try{data=JSON.parse(raw||'{}')}catch(e){data={error:raw}}if(status>=200&&status<300){x.resolve(data)}else{x.reject(Error(data.error||data.message||('Request failed ('+status+')')))}};
async function api(path,method='GET',body=null){return nativeReq(method,path,body==null?'':JSON.stringify(body),'application/json')}
function toast(msg){$('toastRoot').innerHTML='<div class="toast">'+esc(msg)+'</div>';setTimeout(()=>$('toastRoot').innerHTML='',2600)}
function setAuth(signup){isSignup=signup;$('loginTab').classList.toggle('active',!signup);$('signupTab').classList.toggle('active',signup);$('signupFields').classList.toggle('hidden',!signup);$('loginName').parentElement.parentElement.querySelector('label').textContent=signup?'USERNAME':'USERNAME';$('authButton').innerHTML=(signup?'Create account':'Log in')+' <span class="sym">arrow_forward</span>';$('authError').textContent=''}
async function authenticate(){let username=(isSignup?$('signupName').value:$('loginName').value).trim().replace(/^@/,'');let password=$('password').value;if(!username||!password){$('authError').textContent='Enter your username and password.';return}let b=$('authButton');b.disabled=true;b.textContent='Please wait…';$('authError').textContent='';try{let d=await nativeReq('POST',isSignup?'/api/auth/register':'/api/auth/login',JSON.stringify({username,password,...(isSignup?{displayName:username}:{})}),'application/json');if(!d.token)throw Error(d.error||'Authentication failed');token=d.token;localStorage.setItem('lerizToken',token);await boot()}catch(e){$('authError').textContent=e.message}finally{b.disabled=false;b.innerHTML=(isSignup?'Create account':'Log in')+' <span class="sym">arrow_forward</span>'}}
async function boot(){try{let d=await api('/api/me');currentUser=d.user||d;$('auth').classList.add('hidden');$('app').classList.remove('hidden');go('home');loadFeed()}catch(e){token='';localStorage.removeItem('lerizToken');$('auth').classList.remove('hidden');$('app').classList.add('hidden');if(e.message) $('authError').textContent=e.message}}
function setFeed(mode){feedMode=mode;$('forYouTab').classList.toggle('active',mode==='forYou');$('followingTab').classList.toggle('active',mode==='following');loadFeed()}
function videoURL(v){let u=v.videoURL||v.videoUrl||v.url||('/api/videos/'+v.id+'/file');return u.startsWith('http')?u:API+(u.startsWith('/')?u:'/'+u)}
function avatar(u,name){let url=u&&(u.avatarURL||u.avatar_url);return url?'<img class="avatar" src="'+esc(url.startsWith('http')?url:API+(url.startsWith('/')?url:'/'+url))+'" onerror="this.outerHTML=\'<span class=avatar>\'+\'\'+\'</span>\'">':'<div class="avatar">'+esc((name||'L').slice(0,1).toUpperCase())+'</div>'}
async function loadFeed(){if(page!=='home')return;$('feed').innerHTML='<div class="loading"><span class="spinner"></span>Loading videos…</div>';try{let d=await api('/api/feed?mode='+encodeURIComponent(feedMode)+'&limit=100&offset=0');videos=d.videos||[];renderFeed()}catch(e){$('feed').innerHTML='<div class="empty"><span class="sym">cloud_off</span><b>Could not load videos</b><p>'+esc(e.message)+'</p><button class="secondary" onclick="loadFeed()">Try again</button></div>'}}
function renderFeed(){if(!videos.length){$('feed').innerHTML='<div class="empty"><span class="sym">movie</span><b>No videos available</b><p>When creators upload videos, they will appear here.</p><button class="secondary" onclick="go(\'create\')">Upload a video</button></div>';return}$('feed').innerHTML=videos.map((v,i)=>{let u=v.user||{},name=u.displayName||u.display_name||u.username||'Creator',handle=u.username||'user',id=String(v.id),liked=!!v.likedByMe,saved=!!v.savedByMe;return '<article class="clip" data-id="'+esc(id)+'"><video src="'+esc(videoURL(v))+'" playsinline loop preload="'+(i<2?'auto':'metadata')+'" onclick="togglePlayback(this)" onended="this.currentTime=0;this.play()"></video><div class="play-indicator"><span class="sym">play_arrow</span></div><div class="clip-content"><div class="creator">'+avatar(u,name)+'<span>'+esc(name)+'</span><button class="follow" onclick="followUser(\''+esc(handle)+'\',this)">Follow</button></div><div class="caption">'+esc(v.caption||'')+'</div><div class="audio"><span class="sym">music_note</span><span>original audio · '+esc(handle)+'</span></div></div><div class="actions"><button class="action '+(liked?'liked':'')+'" onclick="likeVideo(\''+esc(id)+'\',this)"><span class="sym">'+(liked?'favorite':'favorite_border')+'</span><span>'+fmt(v.likes||0)+'</span></button><button class="action" onclick="openComments(\''+esc(id)+'\')"><span class="sym">chat_bubble</span><span>'+fmt(v.comments||0)+'</span></button><button class="action '+(saved?'liked':'')+'" onclick="saveVideo(\''+esc(id)+'\',this)"><span class="sym">'+(saved?'bookmark':'bookmark_border')+'</span><span>Save</span></button><button class="action" onclick="shareVideo(\''+esc(id)+'\')"><span class="sym">share</span><span>Share</span></button></div></article>'}).join('');observeVideos()}
function fmt(n){n=Number(n)||0;return n>=1000000?(n/1e6).toFixed(1)+'M':n>=1000?(n/1e3).toFixed(1)+'K':String(n)}
let observer;function observeVideos(){if(observer)observer.disconnect();observer=new IntersectionObserver(entries=>entries.forEach(e=>{let v=e.target.querySelector('video');if(e.isIntersecting&&e.intersectionRatio>.6){playingId=e.target.dataset.id;v.play().catch(()=>{})}else v.pause()}),{threshold:[.2,.6,.9]});document.querySelectorAll('.clip').forEach(el=>observer.observe(el))}
function togglePlayback(v){if(v.paused){v.play();v.parentElement.querySelector('.play-indicator').classList.remove('show')}else{v.pause();v.parentElement.querySelector('.play-indicator').classList.add('show')}}
async function likeVideo(id,btn){try{let d=await api('/api/videos/'+encodeURIComponent(id)+'/like','POST',{});let v=videos.find(x=>String(x.id)===id);if(v){v.likedByMe=d.liked??!v.likedByMe;v.likes=d.likes??(Number(v.likes||0)+(v.likedByMe?1:-1))}btn.classList.toggle('liked',!!v?.likedByMe);btn.querySelector('.sym').textContent=v?.likedByMe?'favorite':'favorite_border';btn.lastElementChild.textContent=fmt(v?.likes||d.likes||0)}catch(e){toast(e.message)}}
async function saveVideo(id,btn){try{let d=await api('/api/videos/'+encodeURIComponent(id)+'/save','POST',{});let v=videos.find(x=>String(x.id)===id);if(v)v.savedByMe=d.saved??!v.savedByMe;btn.classList.toggle('liked',!!v?.savedByMe);btn.querySelector('.sym').textContent=v?.savedByMe?'bookmark':'bookmark_border';toast(v?.savedByMe?'Saved':'Removed from saved')}catch(e){toast(e.message)}}
async function followUser(username,btn){try{let d=await api('/api/users/'+encodeURIComponent(username)+'/follow','POST',{username});btn.textContent=(d.following===false||d.followed===false)?'Follow':'Following';toast(btn.textContent==='Following'?'Following @'+username:'Unfollowed @'+username)}catch(e){toast(e.message)}}
function shareVideo(id){let url=API+'/api/videos/'+encodeURIComponent(id)+'/file';if(navigator.share)navigator.share({title:'Leriz video',url}).catch(()=>{});else toast('Video link: '+url)}
function go(next){page=next;$('feedTabs').classList.toggle('hidden',next!=='home');document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===next));let main=$('main');if(next==='home'){main.className='feed-area';$('feed').className='feed-scroller';if(!$('feed').children.length)loadFeed();return}main.className='feed-area';main.innerHTML='<section id="pageContent" class="page"></section>';let p=$('pageContent');if(next==='discover')renderDiscover(p);else if(next==='search')renderSearch(p);else if(next==='create')renderCreate(p);else if(next==='profile')renderProfile(p);else if(next==='inbox')p.innerHTML='<div class="empty"><span class="sym">forum</span><b>Inbox</b><p>Messages will appear here when available.</p></div>'}
function renderDiscover(p){p.innerHTML='<div class="page-title">Discover</div><div class="searchbox"><span class="sym">search</span><input id="discoverQuery" placeholder="Search videos, creators, hashtags" oninput="searchDiscover(this.value)"></div><div class="chips"><button class="chip" onclick="searchDiscover(\'#foryou\')">For You</button><button class="chip" onclick="searchDiscover(\'#trending\')">Trending now</button><button class="chip" onclick="searchDiscover(\'#music\')">Music</button></div><div id="discoverResults" class="video-grid"></div><div id="discoverStatus" class="muted">Search videos and creators</div>';searchDiscover('')}
async function searchDiscover(q){let out=$('discoverResults');if(!out)return;clearTimeout(searchTimer);searchTimer=setTimeout(async()=>{try{let d=await api('/api/feed?mode=discover&limit=100&offset=0');let rows=d.videos||[];if(q&&q[0]!=='#')rows=rows.filter(v=>JSON.stringify(v).toLowerCase().includes(q.toLowerCase()));out.innerHTML=rows.map(v=>'<div class="grid-video" onclick="openGridVideo(\''+esc(v.id)+'\')"><video src="'+esc(videoURL(v))+'" muted playsinline preload="metadata"></video><span class="views">▶ '+fmt(v.views||0)+'</span></div>').join('');$('discoverStatus').textContent=rows.length?rows.length+' videos':'No videos found';out.querySelectorAll('video').forEach(v=>v.addEventListener('loadedmetadata',()=>{try{v.currentTime=Math.min(1,v.duration/3)}catch(e){}}))}catch(e){$('discoverStatus').textContent=e.message}},280)}
function openGridVideo(id){go('home');setTimeout(()=>{let el=[...document.querySelectorAll('.clip')].find(x=>x.dataset.id===String(id));if(el)el.scrollIntoView({behavior:'smooth'})},150)}
function renderSearch(p){p.innerHTML='<div class="page-title">Search</div><div class="searchbox"><span class="sym">search</span><input id="searchInput" placeholder="Search videos and creators" oninput="searchDiscover(this.value)"></div><div class="video-grid" id="discoverResults"></div><div id="discoverStatus" class="muted">Start typing to search</div>'}
function renderCreate(p){p.innerHTML='<div class="page-title">Create</div><div class="panel"><h3 style="margin-top:0">Upload a video</h3><p class="muted">Choose a video from your device, add a caption, and share it on Leriz.</p><label>VIDEO</label><input id="videoFile" type="file" accept="video/*" style="width:100%;margin:9px 0 16px;color:#aaa"><label>CAPTION</label><textarea id="videoCaption" placeholder="Write a caption…"></textarea><button class="primary" id="uploadBtn" onclick="uploadVideo()">Upload video <span class="sym">cloud_upload</span></button><div id="uploadStatus" class="muted"></div></div>'}
async function uploadVideo(){let file=$('videoFile').files[0],caption=$('videoCaption').value;if(!file){toast('Choose a video first');return}if(file.size>150*1024*1024){toast('Choose a video smaller than 150 MB');return}let btn=$('uploadBtn');btn.disabled=true;$('uploadStatus').textContent='Preparing video…';try{let base64=await new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)});$('uploadStatus').textContent='Uploading video…';let id='u'+Date.now();window._requests=window._requests||{};let promise=new Promise((resolve,reject)=>{window._requests[id]={resolve,reject};setTimeout(()=>{if(window._requests[id]){delete window._requests[id];reject(Error('Upload timed out'))}},125000)});LerizNative.uploadVideo(caption,file.name,base64,token,id);await promise;toast('Video uploaded successfully');go('home');loadFeed()}catch(e){$('uploadStatus').textContent=e.message;toast(e.message)}finally{if($('uploadBtn'))$('uploadBtn').disabled=false}}
async function renderProfile(p){p.innerHTML='<div class="loading"><span class="spinner"></span>Loading profile…</div>';try{let d=await api('/api/me'),u=d.user||d;currentUser=u;let name=u.displayName||u.display_name||u.username||'Your profile';p.innerHTML='<div class="page-title">Profile</div><div class="profile-head">'+avatar(u,name)+'<div><div class="profile-name">'+esc(name)+'</div><div class="muted">@'+esc(u.username||'user')+'</div></div></div><div class="stats"><div class="stat"><b>'+fmt(u.followers||0)+'</b><span>Followers</span></div><div class="stat"><b>'+fmt(u.following||0)+'</b><span>Following</span></div><div class="stat"><b>'+fmt(u.likes||0)+'</b><span>Likes</span></div></div><p class="muted">'+esc(u.bio||'No bio yet.')+'</p><div class="profile-buttons"><button class="secondary" onclick="editProfile()">Edit profile</button><button class="secondary" onclick="loadMyVideos()">My videos</button><button class="secondary" onclick="logout()">Log out</button></div><div id="profileExtra"></div>'}catch(e){p.innerHTML='<div class="empty"><b>Could not load profile</b><p>'+esc(e.message)+'</p></div>'}}
function editProfile(){let u=currentUser||{};$('profileExtra').innerHTML='<div class="panel"><h3>Edit profile</h3><label>DISPLAY NAME</label><input id="editDisplay" value="'+esc(u.displayName||u.display_name||'')+'"><label>USERNAME</label><input id="editUsername" value="'+esc(u.username||'')+'"><label>BIO</label><textarea id="editBio">'+esc(u.bio||'')+'</textarea><button class="primary" onclick="saveProfile()">Save changes</button></div>'}
async function saveProfile(){try{let d=await api('/api/me','PATCH',{displayName:$('editDisplay').value,username:$('editUsername').value,bio:$('editBio').value});currentUser=d.user||d;toast('Profile saved');renderProfile($('pageContent'))}catch(e){toast(e.message)}}
async function loadMyVideos(){try{let d=await api('/api/feed?mode=profile&limit=100&offset=0');let rows=(d.videos||[]).filter(v=>!currentUser?.username||v.user?.username===currentUser.username);$('profileExtra').innerHTML='<div class="video-grid">'+rows.map(v=>'<div class="grid-video" onclick="openGridVideo(\''+esc(v.id)+'\')"><video src="'+esc(videoURL(v))+'" muted playsinline></video><span class="views">▶ '+fmt(v.views||0)+'</span></div>').join('')+'</div>'}catch(e){toast(e.message)}}
function logout(){token='';localStorage.removeItem('lerizToken');$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('password').value='';$('loginName').value='';currentUser=null}
async function openComments(id){commentsVideo=id;replyTo=null;editCommentId=null;$('modal').innerHTML='<div class="overlay" onclick="if(event.target===this)closeComments()"><section class="sheet"><div class="sheet-head"><span>Comments</span><button class="icon-btn" onclick="closeComments()"><span class="sym">close</span></button></div><div class="comments-list" id="commentsList"><div class="loading"><span class="spinner"></span>Loading comments…</div></div><div id="replyLabel" class="muted" style="padding:0 15px"></div><div class="comment-input"><input id="commentInput" placeholder="Add a comment…" onkeydown="if(event.key===\'Enter\')postComment()"><button class="send" onclick="postComment()"><span class="sym">send</span></button></div></section></div>';try{let d=await api('/api/videos/'+encodeURIComponent(id)+'/comments');comments=d.comments||[];renderComments()}catch(e){$('commentsList').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function closeComments(){$('modal').innerHTML='';commentsVideo=null}
function renderComments(){let list=$('commentsList');if(!list)return;if(!comments.length){list.innerHTML='<div class="empty"><span class="sym">chat_bubble</span><b>No comments yet</b><p>Be the first to comment.</p></div>';return}let roots=comments.filter(c=>!c.parentId&&!c.parent_id);let children=comments.filter(c=>c.parentId||c.parent_id);list.innerHTML=roots.map(c=>commentHTML(c,false)+children.filter(r=>String(r.parentId||r.parent_id)===String(c.id)).map(r=>commentHTML(r,true)).join('')).join('')}
function commentHTML(c,reply){let user=c.user||{},name=user.username||c.username||'user',mine=String(user.username||c.username||'').toLowerCase()===String(currentUser?.username||'').toLowerCase();return '<div class="comment '+(reply?'reply':'')+'">'+avatar(user,name)+'<div class="comment-body"><div class="comment-user">@'+esc(name)+'</div><div class="comment-text">'+esc(c.text||c.comment||'')+'</div><div class="comment-meta"><span>Just now</span><button onclick="setReply(\''+esc(c.id)+'\',\''+esc(name)+'\')">Reply</button>'+(mine?'<button onclick="editComment(\''+esc(c.id)+'\',\''+esc(c.text||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")+'\')">Edit</button><button onclick="deleteComment(\''+esc(c.id)+'\')">Delete</button>':'')+'</div></div><button class="comment-like" onclick="likeComment(\''+esc(c.id)+'\',this)"><span class="sym">favorite_border</span>'+fmt(c.likes||0)+'</button></div>'}
function setReply(id,name){replyTo=id;$('replyLabel').textContent='Replying to @'+name+' · tap to cancel';$('commentInput').placeholder='Write a reply…';$('commentInput').focus();$('replyLabel').onclick=()=>{replyTo=null;$('replyLabel').textContent='';$('commentInput').placeholder='Add a comment…'}}
async function postComment(){let input=$('commentInput'),text=input.value.trim();if(!text||!commentsVideo)return;try{await api('/api/videos/'+encodeURIComponent(commentsVideo)+'/comments','POST',{text,...(replyTo?{parentId:replyTo}:{})});input.value='';replyTo=null;$('replyLabel').textContent='';let d=await api('/api/videos/'+encodeURIComponent(commentsVideo)+'/comments');comments=d.comments||[];renderComments()}catch(e){toast(e.message)}}
async function likeComment(id,btn){try{let d=await api('/api/comments/'+encodeURIComponent(id)+'/like','POST',{});btn.querySelector('.sym').textContent=(d.liked?'favorite':'favorite_border');btn.style.color=d.liked?'#ff4f9a':''}catch(e){toast(e.message)}}
async function editComment(id,old){let value=prompt('Edit comment',old);if(value===null||!value.trim())return;try{await api('/api/comments/'+encodeURIComponent(id),'PATCH',{text:value.trim()});let d=await api('/api/videos/'+encodeURIComponent(commentsVideo)+'/comments');comments=d.comments||[];renderComments()}catch(e){toast(e.message)}}
async function deleteComment(id){if(!confirm('Delete this comment?'))return;try{await api('/api/comments/'+encodeURIComponent(id),'DELETE',{});let d=await api('/api/videos/'+encodeURIComponent(commentsVideo)+'/comments');comments=d.comments||[];renderComments()}catch(e){toast(e.message)}}
window.addEventListener('load',()=>{if(token)boot()});
</script></body></html>
